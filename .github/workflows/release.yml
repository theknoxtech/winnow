name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The shipped artifact is the script itself - there is nothing to compile. What still needs
      # checking is that it parses, and that the version constant the in-app update check reads
      # actually matches the tag being released.
      - name: Validate the script
        shell: pwsh
        run: |
          $script = 'Winnow.ps1'
          if (-not (Test-Path $script)) { throw "$script not found" }

          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count) {
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              throw "$script has $($errors.Count) parse error(s)"
          }
          Write-Host "$script parses clean"

          $version = ([regex]::Match(
              (Get-Content $script -Raw),
              "\`$script:AppVersion\s*=\s*'([^']+)'")).Groups[1].Value
          $expected = "${{ github.ref_name }}" -replace '^v', ''

          if ($version -ne $expected) {
            throw "Version mismatch: the script reports '$version', the tag is '$expected'. The in-app update check compares that constant against the latest release, so a mismatch would make this release fail to recognise itself as current."
          }
          Write-Host "Version: $version"

      # The script is unsigned, so the SHA-256 is what stands in for a publisher signature: it
      # lets anyone verify the download, and gives a customer's security team a value to write an
      # AppLocker or WDAC hash rule against.
      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'Winnow.ps1' -Algorithm SHA256).Hash.ToLower()
          "$hash *Winnow.ps1" | Set-Content 'Winnow.ps1.sha256' -NoNewline -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "Winnow.ps1" `
            "Winnow.ps1.sha256" `
            --title "${{ github.ref_name }}" `
            --generate-notes

          # Appended after creation rather than passed as --notes: --notes and --generate-notes
          # do not compose, and supplying both loses the generated changelog.
          $notes = (gh release view "${{ github.ref_name }}" --json body -q .body | Out-String).TrimEnd()

          # Built line by line rather than as a here-string. A markdown code fence is three
          # backticks, and the backtick is PowerShell's escape character - embedding fences in a
          # double-quoted here-string means escaping every one of them, which is unreadable and
          # easy to get subtly wrong.
          $fence = [string][char]0x60 * 3
          $sha   = $env:SHA256

          $running = @(
            # Two blank lines, not one: '---' directly beneath a line of text is a setext
            # heading in markdown, which would silently reformat the last changelog entry
            # instead of drawing a rule.
            ''
            ''
            '---'
            ''
            '### Running it'
            ''
            ($fence + 'powershell')
            'powershell.exe -STA -ExecutionPolicy Bypass -File .\Winnow.ps1'
            $fence
            ''
            '`-ExecutionPolicy Bypass` is needed because a script downloaded through a browser carries a'
            'Mark-of-the-Web tag, and the default `RemoteSigned` policy refuses to run it. It applies to that'
            'one invocation only and changes no machine-wide setting - `Unblock-File .\Winnow.ps1` once is the'
            'alternative. `-STA` is required for WinForms.'
          ) -join "`n"

          $verify = @(
            ''
            ''
            '---'
            ''
            '### Verifying this download'
            ''
            'Winnow.ps1 is unsigned, so this hash is what stands in for a publisher signature.'
            'Check it before running the file on a customer machine:'
            ''
            ($fence + 'powershell')
            ("(Get-FileHash Winnow.ps1 -Algorithm SHA256).Hash -eq '" + $sha + "'")
            $fence
            ''
            'SHA-256:'
            ''
            $fence
            $sha
            $fence
            ''
            'Being a text file, it can also simply be read - it is one self-contained script with no'
            'obfuscation and no downloaded payloads.'
          ) -join "`n"

          ($notes + $running + $verify) | Set-Content release-notes.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
