name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # There is no compiler to catch a typo in the script, so this is the only thing standing
      # between a bad edit and a broken release. Also checks the version constant the in-app
      # update check reads actually matches the tag being released.
      - name: Validate the script
        id: validate
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path .\Winnow.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count) {
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              throw "Winnow.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host 'Winnow.ps1 parses clean'

          $version = ([regex]::Match(
              (Get-Content .\Winnow.ps1 -Raw),
              "\`$script:AppVersion\s*=\s*'([^']+)'")).Groups[1].Value
          $expected = "${{ github.ref_name }}" -replace '^v', ''

          if ($version -ne $expected) {
            throw "Version mismatch: the script reports '$version', the tag is '$expected'. The in-app update check compares that constant against the latest release, so a mismatch would make this release fail to recognise itself as current."
          }
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build the executable
        shell: pwsh
        run: .\build\Build-Exe.ps1 -Version "${{ steps.validate.outputs.version }}"

      - name: Verify the executable
        shell: pwsh
        run: |
          $exe = 'dist\Winnow.exe'
          if (-not (Test-Path $exe)) { throw 'Build produced no executable' }

          $stamped  = (Get-Item $exe).VersionInfo.FileVersion
          $expected = "${{ steps.validate.outputs.version }}"
          if (-not $stamped.StartsWith($expected)) {
            throw "The exe reports version '$stamped', expected '$expected'."
          }
          Write-Host "Stamped: $stamped"

      # Both artifacts are unsigned, so these hashes are what stand in for a publisher signature:
      # they let anyone verify a download, and give a customer's security team a value to write an
      # AppLocker or WDAC hash rule against.
      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash 'dist\Winnow.exe' -Algorithm SHA256).Hash.ToLower()
          $ps1Hash = (Get-FileHash 'Winnow.ps1'      -Algorithm SHA256).Hash.ToLower()

          "$exeHash *Winnow.exe" | Set-Content 'dist\Winnow.exe.sha256' -NoNewline -Encoding ascii
          "$ps1Hash *Winnow.ps1" | Set-Content 'Winnow.ps1.sha256'      -NoNewline -Encoding ascii

          "exe=$exeHash" >> $env:GITHUB_OUTPUT
          "ps1=$ps1Hash" >> $env:GITHUB_OUTPUT
          Write-Host "Winnow.exe: $exeHash"
          Write-Host "Winnow.ps1: $ps1Hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXE_SHA: ${{ steps.hash.outputs.exe }}
          PS1_SHA: ${{ steps.hash.outputs.ps1 }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Winnow.exe" `
            "dist/Winnow.exe.sha256" `
            "Winnow.ps1" `
            "Winnow.ps1.sha256" `
            --title "${{ github.ref_name }}" `
            --generate-notes

          # Appended after creation rather than passed as --notes: --notes and --generate-notes
          # do not compose, and supplying both loses the generated changelog.
          $notes = (gh release view "${{ github.ref_name }}" --json body -q .body | Out-String).TrimEnd()

          # Built line by line rather than as a here-string. A markdown code fence is three
          # backticks, and the backtick is PowerShell's escape character - embedding fences in a
          # double-quoted here-string means escaping every one of them, which is unreadable and
          # easy to get subtly wrong.
          $fence = [string][char]0x60 * 3

          $body = @(
            # Two blank lines, not one: '---' directly beneath a line of text is a setext heading
            # in markdown, which would silently reformat the last changelog entry into a heading
            # instead of drawing a rule.
            ''
            ''
            '---'
            ''
            '### Which file do I want?'
            ''
            '**`Winnow.exe`** - double-click and go. This is the one most people want.'
            ''
            '**`Winnow.ps1`** - the same application as a script, and the fallback if the exe is ever'
            'quarantined. Both are unsigned, and Windows Defender has flagged unsigned executables from'
            'this project before (`Trojan:Win32/Wacatac.*!ml`, a machine-learning verdict rather than a'
            'signature match). That classifier applies to PE binaries and cannot apply to a script, so if'
            'the exe is blocked on a machine, the script will still run:'
            ''
            ($fence + 'powershell')
            'powershell.exe -STA -ExecutionPolicy Bypass -File .\Winnow.ps1'
            $fence
            ''
            '`-ExecutionPolicy Bypass` is needed because a script downloaded through a browser carries a'
            'Mark-of-the-Web tag that the default `RemoteSigned` policy refuses to run. It applies to that'
            'one invocation and changes no machine-wide setting.'
            ''
            '---'
            ''
            '### Verifying these downloads'
            ''
            'Both files are unsigned, so these hashes are what stand in for a publisher signature.'
            'Check before running either on a customer machine:'
            ''
            ($fence + 'powershell')
            ("(Get-FileHash Winnow.exe -Algorithm SHA256).Hash -eq '" + $env:EXE_SHA + "'")
            ("(Get-FileHash Winnow.ps1 -Algorithm SHA256).Hash -eq '" + $env:PS1_SHA + "'")
            $fence
            ''
            '| File | SHA-256 |'
            '|---|---|'
            ('| `Winnow.exe` | `' + $env:EXE_SHA + '` |')
            ('| `Winnow.ps1` | `' + $env:PS1_SHA + '` |')
          ) -join "`n"

          ($notes + $body) | Set-Content release-notes.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
